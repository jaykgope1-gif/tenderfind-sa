# Daily update: fetch new tenders -> read their PDFs -> rebuild the site -> save data -> publish.
# Started every morning at 04:47 SA time by n8n ("TenderFind SA - Daily update trigger"), which
# waits for it, logs the result and retries once. GitHub's own timer below is only a backup: it is
# best-effort and often skipped. A run that finds nothing new is harmless. "Run workflow" works any time.
name: Daily update

on:
  schedule:
    - cron: "47 3 * * *" # 05:47 SAST backup, an hour after the n8n trigger
  workflow_dispatch:

permissions:
  contents: write # commit the updated data back to the repo
  pages: write # publish to GitHub Pages
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keeps yesterday's data (and still succeeds) if the eTenders API is down.
      - name: Fetch tenders
        run: node scripts/fetch.js

      # Gauteng department tenders that are only on the Gauteng e-Tender portal. Never blocks the job.
      - name: Fetch Gauteng portal tenders
        run: node scripts/fetch-gauteng.js
        continue-on-error: true

      # Only new or changed tenders are read. AI is used only if the ANTHROPIC_API_KEY secret exists.
      - name: Read tender documents
        run: node scripts/extract.js
        continue-on-error: true # a PDF problem should never stop the site updating
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build site
        run: node scripts/build.js

      # New tenders + "closing in 3 days", grouped for the WhatsApp alerts (docs/n8n-alerts.md).
      - name: Alerts file
        run: node scripts/alerts.js
        continue-on-error: true # n8n refuses a stale file, so this must never block the site

      # Picture of the day's social post (site/social/card.png), attached to the owner's 06:45 email.
      - name: Social card
        run: node scripts/social-card.js
        continue-on-error: true # a missing picture should never stop the site updating

      - name: Safety check (never publish an empty site)
        run: node scripts/check-site.js

      - name: Save data to the repo
        run: |
          git config user.name "tenderfind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json data/extracted.json data/fetch-log.json
          [ -d data/archive ] && git add data/archive
          git add -A data/alerts
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
