# Daily update: fetch new tenders -> read their PDFs -> rebuild the site -> save data -> publish.
# Runs at 05:17 South Africa time, again at 06:07 as a backup (GitHub sometimes delays or skips
# scheduled runs; a second run just finds nothing new), and whenever you press "Run workflow".
name: Daily update

on:
  schedule:
    - cron: "17 3 * * *" # 05:17 SAST; off the hour, when GitHub is less busy
    - cron: "7 4 * * *" # 06:07 SAST backup, still before the 06:30 WhatsApp send
  workflow_dispatch:

permissions:
  contents: write # commit the updated data back to the repo
  pages: write # publish to GitHub Pages
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keeps yesterday's data (and still succeeds) if the eTenders API is down.
      - name: Fetch tenders
        run: node scripts/fetch.js

      # Only new or changed tenders are read. AI is used only if the ANTHROPIC_API_KEY secret exists.
      - name: Read tender documents
        run: node scripts/extract.js
        continue-on-error: true # a PDF problem should never stop the site updating
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build site
        run: node scripts/build.js

      # New tenders + "closing in 3 days", grouped for the WhatsApp alerts (docs/n8n-alerts.md).
      - name: Alerts file
        run: node scripts/alerts.js
        continue-on-error: true # n8n refuses a stale file, so this must never block the site

      - name: Safety check (never publish an empty site)
        run: node scripts/check-site.js

      - name: Save data to the repo
        run: |
          git config user.name "tenderfind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json data/extracted.json data/fetch-log.json
          [ -d data/archive ] && git add data/archive
          git add -A data/alerts
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
